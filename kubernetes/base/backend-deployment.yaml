apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: conduit
spec:
  # replicas is intentionally absent: the HorizontalPodAutoscaler owns this field.
  # Declaring it here would reset a scaled-out Deployment back to the baseline on
  # every apply, dropping capacity under exactly the load that caused the scale-out.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: conduit
    spec:
      # The application installs no SIGTERM handler. The grace period plus the
      # preStop delay below let the endpoint be withdrawn and in-flight requests
      # finish before the container is killed.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across zones so a single AZ failure cannot take out the
      # whole deployment.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          # Liveness deliberately avoids the database: an RDS outage must not
          # cause kubelet to restart every replica on top of it.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness uses the cheapest endpoint that proves the database is
          # reachable, so an unhealthy replica leaves the Service endpoints.
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit: throttling a Node process adds tail latency without
              # protecting the node, which the request already does.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
