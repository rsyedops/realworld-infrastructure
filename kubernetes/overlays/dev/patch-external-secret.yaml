# Values created by the infrastructure. render.sh substitutes them at deploy time
# from the live account, so nothing account-specific is committed.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      region: ${AWS_REGION}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conduit-secrets
  annotations:
    eks.amazonaws.com/role-arn: ${EXTERNAL_SECRETS_ROLE_ARN}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  target:
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgresql://{{ .db_username }}:{{ .db_password | urlquery }}@${DB_HOST}:5432/${DB_NAME}?sslmode=require
        JWT_SECRET: "{{ .jwt_secret }}"
  data:
    - secretKey: db_username
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: username
    - secretKey: db_password
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: password
    - secretKey: jwt_secret
      remoteRef:
        key: ${APP_SECRET_NAME}
        property: JWT_SECRET
