# Local validation stack. The two applications live in separate repositories and
# are referenced here only as build contexts; nothing is shared between them.
name: conduit

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: only the compose network reaches the database,
    # mirroring the private-subnet placement of RDS.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../../express-postgresql-backend
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_EXP: ${JWT_EXP}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../../express-postgresql-backend
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_EXP: ${JWT_EXP}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../../react-vite-frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "8080"

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
