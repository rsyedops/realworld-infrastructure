# Credentials never exist in git. External Secrets reads the RDS-managed secret
# and the application secret from Secrets Manager and projects them into one
# Kubernetes Secret, using IRSA rather than static AWS keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conduit-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: PLACEHOLDER
      auth:
        jwt:
          # A namespaced SecretStore may only reference a ServiceAccount in its
          # own namespace, so the role is bound here rather than to the operator.
          # This also keeps the permission scoped to this application.
          serviceAccountRef:
            name: conduit-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # urlquery percent-encodes the generated password; RDS may include
        # characters that would otherwise terminate the connection string early.
        DATABASE_URL: >-
          postgresql://{{ .db_username }}:{{ .db_password | urlquery }}@PLACEHOLDER
        JWT_SECRET: "{{ .jwt_secret }}"
  data:
    - secretKey: db_username
      remoteRef:
        key: PLACEHOLDER
        property: username
    - secretKey: db_password
      remoteRef:
        key: PLACEHOLDER
        property: password
    - secretKey: jwt_secret
      remoteRef:
        key: PLACEHOLDER
        property: JWT_SECRET
