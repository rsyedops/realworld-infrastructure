# Runs once per release, before the Deployment rolls, so schema changes are
# applied exactly once rather than raced by every replica at startup.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    # Selected by the deployment workflow, which applies the Job on its own
    # before the rest of the manifests.
    app.kubernetes.io/name: migrate
  annotations:
    # The image tag makes each release a distinct Job; the name is patched per
    # release by the deployment workflow.
    kubernetes.io/description: Applies Drizzle migrations against RDS.
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: conduit
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: backend-migrator:latest
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
