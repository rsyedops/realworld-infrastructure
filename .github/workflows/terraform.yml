name: Terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["terraform/**"]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_github_repositories: ${{ vars.DEPLOY_REPOSITORIES }}
  TF_VAR_github_oidc_provider_arn: ${{ vars.GH_OIDC_PROVIDER_ARN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive terraform

      # No backend: validation needs neither state nor credentials.
      - name: Init
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      # Pointed at each root separately. Given the parent directory tfsec stops at
      # the first root it finds, which silently skipped everything under
      # environments and modules.
      - name: Static analysis
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/environments/dev

      - name: Static analysis (bootstrap)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/bootstrap

  plan:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Backend settings come from repository variables so a fresh checkout needs
      # no local file and no account-specific value is committed.
      - name: Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=conduit/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -no-color

  apply:
    needs: plan
    # Only a push to main applies. Pull requests never reach this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=conduit/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve

      - name: Outputs
        working-directory: terraform/environments/dev
        run: terraform output
