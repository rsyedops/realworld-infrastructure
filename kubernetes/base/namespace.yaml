apiVersion: v1
kind: Namespace
metadata:
  name: conduit
  labels:
    app.kubernetes.io/part-of: conduit
    # Baseline is enough: the workloads need no elevated capabilities, and
    # restricted would reject the upstream nginx image's default securityContext.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
