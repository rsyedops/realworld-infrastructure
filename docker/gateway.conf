# Local stand-in for the Kubernetes ingress: one origin for the browser, with
# /api and /images routed to the backend and everything else to the SPA. Keeping
# the topology identical locally is what lets the same images ship unchanged.
#
# Upstreams are resolved per request through Docker's embedded DNS rather than
# declared in an upstream block. nginx resolves an upstream hostname once at
# startup and caches it for the life of the process, so a container that comes
# back on a different IP after a restart would otherwise be unreachable until
# the gateway itself was restarted. A variable in proxy_pass forces re-resolution.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fail over to the next resolved address instead of returning 502 while a
    # replacement container is still coming up.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 3s;

    location /api/ {
        set $backend_host backend:3000;
        proxy_pass http://$backend_host$request_uri;
    }

    # Default avatars are served by the backend's static middleware.
    location /images/ {
        set $backend_host backend:3000;
        proxy_pass http://$backend_host$request_uri;
    }

    location / {
        set $frontend_host frontend:8080;
        proxy_pass http://$frontend_host$request_uri;
    }
}
